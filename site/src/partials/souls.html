<section class="band" id="souls">
  <h2><span class="num">05</span>The party</h2>
  <p class="wide">Twelve live slots, twelve portraits. The name is a cosmetic label on slot N, and slot N is
    worker <code>wN</code>. A respawned body keeps its slot. No personalities, no prompts: every worker runs the same rules.</p>
