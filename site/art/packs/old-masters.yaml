# old-masters — oil-painting portraits after classic museum portraiture (fictional sitters)
title: "Old Masters"
style: >-
  Classical oil painting in the manner of 17th-century Dutch and Flemish museum portraiture: rich glazed
  oil paint, visible fine brushwork and craquelure, warm chiaroscuro lighting, dignified sitters in period
  dress. Paint only the figure; the background stays flat magenta.
