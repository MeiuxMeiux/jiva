# Apache vhost for jiva.meiuxmeiux.com: strict static headers. Installed by hand (docs/DEPLOY.md).
# certbot --apache clones this into the :443 vhost, headers included. CSP must match site/src/index.html.
<VirtualHost *:80>
    ServerName jiva.meiuxmeiux.com
    DocumentRoot /var/www/jiva.meiuxmeiux.com/current
    AddType image/webp .webp
    <Directory /var/www/jiva.meiuxmeiux.com/current>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set Strict-Transport-Security "max-age=300"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
    ErrorLog ${APACHE_LOG_DIR}/jiva-error.log
    CustomLog ${APACHE_LOG_DIR}/jiva-access.log combined
</VirtualHost>
