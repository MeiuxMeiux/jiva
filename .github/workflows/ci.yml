name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck all tracked *.sh
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  check:
    # headless budgets: sizes, parse, json, shellcheck, README drift. `just doctor` needs a live
    # tmux/claude fleet, so it stays a local gate (see the PR template).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:  # apt's just is too old for [positional-arguments]; pin a release, checksum-verified
      JUST_VERSION: 1.43.1
      JUST_SHA256: 6a3003f68fa4d86ada8afe33830a88ffdb6c2fcaff4e5a840b1cb90eaf6f46fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck tmux
          f="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/casey/just/releases/download/${JUST_VERSION}/$f"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" just
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: just check
        run: just check
      - name: kit test (fake claude, no seats)
        run: bash kit/test.sh
      - name: kit stranger path (build kit.md, extract, run the extracted self-test)
        run: just kit-selftest


  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: secret scan (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
